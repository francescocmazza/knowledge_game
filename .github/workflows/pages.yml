name: Test and publish STONA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-adaptive.mjs
      - run: git diff --exit-code -- index.html kids/index.html
      - run: node tests/adaptive.mjs
      - run: node tests/catalog.mjs
      - run: node tests/profiles.mjs
      - run: node tests/content.mjs
      - run: node tests/progression.mjs
      - run: node tests/kids.mjs
      - run: node tests/scoring-and-skips.mjs
      - run: node tests/engagement.mjs
      - run: node tests/profiles.mjs kids/index.html
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package public game only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/kids
          cp kids/index.html _site/kids/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
