async function registerProfile(values){const name=String(values.username||'').trim().normalize('NFKC'),password=String(values.password||'');if(!validName(name))throw Error('Usa un nome da 2 a 24 caratteri: lettere, numeri, spazi, punto, trattino o _.');if(password.length<4||password.length>200)throw Error('Scegli una password da 4 a 200 caratteri.');if(vault.profiles.some(p=>nameKey(p.username)===nameKey(name)))throw Error('Questo nome è già presente qui. Usa Accedi o scegli un altro nome.');if(vault.profiles.length>=20)throw Error('Hai già 20 profili su questo browser.');
 await writeQueue;const salt=b64(crypto.getRandomValues(new Uint8Array(16))),key=await derive(password,salt),record={id:newId(),username:name,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const progress=structuredClone(state);progress.displayName=name;record.rankSummary=progress.leaderboardEnabled?rankSummary(record,progress):null;Object.assign(record,await seal({id:record.id,name,createdAt:record.createdAt,state:progress},key,salt));vault.profiles.push(record);if(!persistVault()){vault.profiles.pop();downloadJSON(envelope(record),'STONA-Kids-profilo-backup.json');throw Error('Il browser non consente il salvataggio. Ho scaricato il profilo cifrato: conservalo e importalo su un browser che permetta i dati locali.');}vault.guest={id:newId(),name:'Ospite',createdAt:new Date().toISOString(),state:freshState()};persistVault();activate(record.id,key,progress);profileMessage='Profilo creato: i tuoi progressi sono stati conservati. Esporta una copia per portarli su un altro dispositivo.';}

async function importProfile(form,values){const file=form.querySelector('[type=file]').files[0];if(!file)throw Error('Scegli il file JSON del tuo profilo.');if(file.size>1000000)throw Error('Il file è troppo grande. Scegli un file profilo Stona Kids.');let e;try{e=JSON.parse(await file.text())}catch(err){throw Error('Il file non è un JSON leggibile.');}const {payload,key}=await openEnvelope(e,String(values.password||''));await writeQueue;
 const same=vault.profiles.find(p=>p.id===payload.id),collision=vault.profiles.find(p=>p.id!==payload.id&&nameKey(p.username)===nameKey(payload.name));if(collision)throw Error('Su questo browser esiste un altro profilo con lo stesso nome. Usa un browser diverso per importare questo file.');let merged=payload.state;
 if(same){const old=await openEnvelope(envelope(same),String(values.password||''));const byId=new Map(old.payload.state.history.map(r=>[r.id,r]));for(const r of payload.state.history)if(!byId.has(r.id))byId.set(r.id,r);merged=normalizeState({...payload.state,history:[...byId.values()].sort((a,b)=>a.date.localeCompare(b.date)),onboardingDone:old.payload.state.onboardingDone||payload.state.onboardingDone,invites:{name:old.payload.state.invites.name||payload.state.invites.name,register:old.payload.state.invites.register||payload.state.invites.register},leaderboardEnabled:old.payload.state.leaderboardEnabled,learning:{...old.payload.state.learning,floor:Math.max(old.payload.state.learning.floor,payload.state.learning.floor),cursor:Math.max(old.payload.state.learning.cursor,payload.state.learning.cursor),events:ADAPTIVE.normalizeEvents([...old.payload.state.learning.events,...payload.state.learning.events],PUZZLES)}});}
 if(!same&&vault.profiles.length>=20)throw Error('Hai già 20 profili su questo browser.');const record={id:payload.id,username:payload.name,createdAt:payload.createdAt,updatedAt:new Date().toISOString(),...await seal({...payload,state:merged},key,e.salt)};record.rankSummary=merged.leaderboardEnabled?rankSummary(record,merged):null;const previous=structuredClone(vault.profiles);if(same)Object.assign(same,record);else vault.profiles.push(record);if(!persistVault()){vault.profiles=previous;throw Error(storageError);}activate(record.id,key,merged);profileMessage='Profilo importato. Puoi riprendere a giocare: '+Object.keys(state.completed).length+' enigmi conservati.';}

function next(){pendingInvitation='';
  if(session.count>=session.total){active=null;session.done=true;render();return;}
  const {p,replay,difficulty=p?.level,target=difficulty}=choosePuzzle();
  if(!p){active=null;session.noQuestions=true;render();return;}session.noQuestions=false;
  let mapped=p.items.map((text,original)=>({text,original}));if(!p.ordered)mapped=shuffle(mapped);
  const alternatives=[...new Set(PUZZLES.filter(x=>x.domain===p.domain&&x.rule!==p.rule).map(x=>x.rule))];
  const other=shuffle(alternatives).slice(0,2);let options=shuffle([p.rule,...other]);
  active={p,replay,difficulty,target,playerLevel:playLevel(),abilityLevel:unlockedLevel(),domainLevel:ADAPTIVE.domainLevel(state,p.domain,KIDS_EDITION,PUZZLES),items:mapped,step:'spot',hints:0,elapsedMs:0,clockSince:Date.now(),clockRunning:true,mistakes:0,fixMistakes:0,ruleMistakes:0,spot:false,fix:false,rule:false,skipped:false,message:'',options,earned:0};

function markDone(){
  if(!active||active.step==='result')return;
  tickClock();const a=active,p=a.p;const beforeUnlock=unlockedLevel();recordAttempt(a.skipped?'revealed':'solved');
  const cleanSpot=a.spot&&a.mistakes===0;
  let quality=0;
  if(a.spot)quality+=cleanSpot?40:25;
  if(a.fix)quality+=a.fixMistakes===0?25:15;
  if(a.rule)quality+=a.ruleMistakes===0?25:15;
  if(a.spot&&a.fix&&a.hints===0)quality+=10;
  quality=Math.min(100,Math.round(quality*(1+0.035*(p.level-1))));
  let pts=a.skipped?4:(a.spot?10:0)+(a.fix?10:0)+(a.rule?10:0)+(a.hints===0&&a.spot?5:0);
  if(state.mode==='sfida'&&!a.skipped&&a.hints===0&&a.spot&&a.fix&&a.rule)pts+=5;
  if(a.replay||state.completed[p.id])pts=0;
  a.earned=pts;
  if(!state.completed[p.id]){
    state.completed[p.id]=true;
    state.xp+=pts;
    state.history.push({id:p.id,domain:p.domain,quality,level:a.difficulty,seenRevision:p.revision||1,playerLevel:a.playerLevel,tierVersion:2,clean:!!(a.spot&&a.fix&&a.rule&&!a.skipped&&a.hints===0&&a.mistakes+a.fixMistakes+a.ruleMistakes===0),durationMs:Math.round(a.elapsedMs),spot:a.spot,fix:a.fix,rule:a.rule,hints:a.hints,skipped:a.skipped,xp:pts,date:new Date().toISOString()});
  }else if(a.spot&&a.fix&&a.rule&&!a.skipped&&a.hints===0&&a.mistakes+a.fixMistakes+a.ruleMistakes===0){
    const previous=state.history.find(r=>r.id===p.id);
    if(previous&&(previous.tierVersion!==2||!previous.clean||(previous.playerLevel<a.playerLevel&&a.difficulty>=a.playerLevel)))Object.assign(previous,{tierVersion:2,level:a.difficulty,playerLevel:a.playerLevel,clean:true,durationMs:Math.round(a.elapsedMs),quality,spot:true,fix:true,rule:true,hints:0,skipped:false});
  }
  const seenResult=state.history.find(r=>r.id===p.id);if(seenResult)seenResult.seenRevision=p.revision||1;
  const unlocked=unlockedLevel();if(unlocked>beforeUnlock){a.unlocked=unlocked;const moving=state.playLevel===beforeUnlock;if(moving)state.playLevel=unlocked;const fast=a.elapsedMs<=ADAPTIVE.expectedMs(a.difficulty,KIDS_EDITION);a.promotionText=(fast?'Bravo, complimenti! Le tue risposte corrette e veloci hanno aperto il livello successivo. ':'Complimenti! Le tue risposte corrette hanno aperto il livello successivo. ')+(moving?'Ti abbiamo passato al livello ':'Hai sbloccato il livello ')+unlocked+' · '+LEVELS[unlocked]+'. '+(moving?'Il percorso si alza: continuerai a trovare domande più facili e qualche nuova sfida. Puoi sempre scegliere un ritmo tranquillo.':'Puoi sceglierlo quando vuoi.');}
  state.learning.floor=Math.max(state.learning.floor,unlocked);offerInvitation();save();

  a.step='result';render();
}
function chooseSpot(original){if(!active||active.step!=='spot')return;

  else{a.mistakes++;a.message='Non è l’elemento che rompe il collegamento. Puoi riprovare o chiedere un indizio.'}
  render();
}
function chooseFix(value){if(!active||active.step!=='fix')return;const a=active;
  if(value===a.p.correct){a.fix=true;a.step='rule';a.message='Correzione riuscita. Qual è la regola che tiene insieme gli elementi?'}
  else{a.fixMistakes++;a.message='Questa sostituzione non ricrea lo schema previsto. Riprova o chiedi un indizio.'}
  render();
}
function chooseRule(rule){if(!active||active.step!=='rule')return;const a=active;

function questionStep(){const a=active,p=a.p;const stepIdx=['spot','fix','rule','result'].indexOf(a.step);const msg=a.step==='spot'?'Quale elemento è diverso dagli altri? Toccalo!':a.step==='fix'?'Quale elemento inseriresti al suo posto?':a.step==='rule'?'Quale spiegazione tiene insieme gli altri elementi?':'Ecco il collegamento che rende coerente la sequenza.';

}
function mapView(){return `<div class="section-kicker">Le tue scoperte</div><h1 class="section-heading">I tuoi progressi, tema per tema.</h1><p class="lead">Qui trovi gli XP realmente ottenuti. Un tema non ancora giocato parte da zero: nessuna stima iniziale.</p><div class="statrow"><div class="statbox"><big>${state.xp}</big><span>XP totali · somma degli otto temi</span></div><div class="statbox"><big>${solvedCount()}</big><span>soluzioni complete</span></div></div><div class="map-grid">${Object.entries(DOMAINS).map(([d,m])=>`<div class="map-card"><div class="map-top"><span class="sect-icon">${m.symbol}</span><span class="circle-score">${domainXP(d)} XP</span></div><h2 style="margin:17px 0 0">${m.name}</h2><p>${m.intro}</p><div class="smallrow"><span>${progress(d)} / ${PUZZLES.filter(p=>p.domain===d).length} domande esplorate</span><span>${history(d).length?'Tema giocato':'Non ancora giocato'}</span></div><div class="bar"><i style="width:${progress(d)/PUZZLES.filter(p=>p.domain===d).length*100}%"></i></div><button class="btn" data-action="domain" data-val="${d}">Gioca in ${m.name} →</button></div>`).join('')}</div><div class="details"><h3>Come funziona</h3><p class="muted">Ogni domanda assegna XP soltanto al proprio tema. La barra indica quante domande hai esplorato. «Salta domanda» non dà né toglie punti e non conta come una risposta sbagliata. «Scopri la soluzione» resta un’azione diversa, per leggere la spiegazione. I livelli di difficoltà si aprono con le stelle delle risposte corrette in tutti i temi: non sono punti assegnati a una materia.</p><button class="btn corally" data-action="reset">Azzera questo percorso</button></div>`;}
function aboutView(){return `<div class="section-kicker">Come si gioca a Stona Kids</div><h1 class="section-heading">Non sapere la risposta è parte del gioco.</h1><p class="lead">Guarda, trova ciò che stona e scopri il collegamento. Se ti blocchi, puoi chiedere un indizio: sbagliare fa parte del gioco.</p><div class="map-grid"><div class="card"><div class="section-kicker">01 · Guarda</div><h2>Trova ciò che stona</h2><p class="muted">Otto elementi sono mostrati senza categoria dichiarata. Trova quello che non si accorda con gli altri.</p></div><div class="card"><div class="section-kicker">02 · Ripara</div><h2>Sostituiscilo</h2><p class="muted">Scegli una sostituzione coerente. Nella versione finale potranno essere accettate più correzioni diverse.</p></div><div class="card"><div class="section-kicker">03 · Comprendi</div><h2>Scopri il filo nascosto</h2><p class="muted">Individua la regola, oppure leggi la spiegazione senza perdere punti.</p></div><div class="card"><div class="section-kicker">🌟 · Il tuo ritmo</div><h2>Parti facile, poi esplora</h2><p class="muted">Dieci livelli con un ritmo che alterna scoperte facili e piccole sfide. Una soluzione completa senza aiuti vale una stella; una risposta veloce ne vale due. Il tempo di riferimento cresce con la difficoltà. Quattro stelle da risposte almeno al tuo livello aprono il successivo. Nessuna penalità se rispondi con calma.</p></div></div><div class="details"><h3>Il tuo mondo Kids</h3><p class="muted">320 enigmi in 8 temi, 10 livelli progressivi e ritmo adattivo, interessi personalizzabili, icone e immagini simboliche, 2 indizi per enigma, 3 modalità, sessioni di 10 sfide, esperienza persistente, mappa e XP distinti per tema. I progressi si salvano nel browser. Puoi proteggerli con un profilo facoltativo ed esportarli in un file cifrato per importarli altrove. La modalità «Sfida personale» non è una classifica online.</p><p class="muted">Among Us è un gioco di equipaggio e impostori: l’equipaggio completa compiti e cerca l’impostore. Qui trovi mini-missioni di logica inventate, non una partita online: non devi avere un account Among Us e tutti gli indizi sono nei tasselli.</p><button class="btn primary" data-action="view" data-val="play">Torna alle sfide →</button></div>`}
function welcome(){return `<section class="welcome kids-welcome"><div class="section-kicker">STONA KIDS · 8–14 ANNI</div><h1 class="section-heading">Otto mondi.<br>Un dettaglio che stona.</h1><p class="lead">Numeri, animali, spazio e una missione speciale Among Us. Trova l’elemento fuori posto, correggilo e scopri il perché!</p><div class="actionrow welcome-actions"><button class="btn primary" data-action="quick-play">Gioca subito →</button><button class="btn soft" data-action="view" data-val="profile">Il mio profilo / Importa</button></div><p class="save-note">Niente registrazione. Niente installazione. I tuoi progressi restano qui.</p><div class="kids-worlds">${Object.entries(DOMAINS).map(([d,m])=>`<button class="world-card" data-action="domain" data-val="${d}"><span class="world-icon" aria-hidden="true">${m.symbol}</span><strong>${m.name}</strong><small>${m.intro}</small></button>`).join('')}</div><div class="details"><strong>Parti facile. Poi scopri nuovi livelli.</strong><p class="muted" style="margin:8px 0 0">320 enigmi, 8 temi, 10 livelli. Nessun conto alla rovescia: una risposta giusta data con calma ti fa comunque avanzare. Puoi chiedere indizi o scoprire la soluzione.</p></div></section>`;}
function render(){tickClock();const app=document.getElementById('app');let content;if(editingInterests)content=onboarding().replace(header(),'');else if(view==='profile')content=profileView();else if(view==='leaderboard')content=leaderboardView();else if(!state.onboardingDone&&view==='play')content=welcome();else content=view==='map'?mapView():view==='about'?aboutView():game();
 app.innerHTML=`<div class="app">${header()}${navbar()}${profileMessage&&view!=='profile'?`<div class="banner" role="status">${esc(profileMessage)}</div>`:''}${storageError?`<div class="status-error" role="alert">${esc(storageError)}</div>`:''}<main id="main" tabindex="-1" class="${busy?'busy':''}">${content}</main><footer class="footer">Stona Kids · Alpha 0.4 · 320 enigmi · Nessuna registrazione obbligatoria. Profili e progressi restano nel browser; trasferimento tramite file da «Il mio profilo». Nessun invio automatico dei dati di gioco. <a href="../">STONA classico</a> · Il tema Among Us è una creazione non ufficiale, senza collegamento al videogioco o a Innersloth.</footer></div>`;
 if(view==='play'&&active?.unlocked&&active.step==='result'&&!active.promotionAnnounced){const el=document.getElementById('level-up');if(typeof el?.focus==='function')el.focus();active.promotionAnnounced=true;}
}
function quickPlay(){if(!state.onboardingDone){state.onboardingDone=true;save();}editingInterests=false;view='play';if(!active&&!session.done)next();else render();}
document.getElementById('app').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const act=b.dataset.action,val=b.dataset.val;
 if(busy)return;
 if(act==='dismiss-invite'){closeInvitation();return;}
 if(act==='board-filter'){if(val==='all'||DOMAINS[val])boardFilter=val;render();return;}
 if(act==='toggle-leaderboard'){if(currentId!=='guest'||state.displayName){state.leaderboardEnabled=!state.leaderboardEnabled;save();render();}return;}
 if(act==='export-feedback'){exportFeedback();return;}
 if(act==='pass-reason'){notePassReason(val);return;}
 if(act==='pace'){state.learning.pace=val==='gentle'?'gentle':'balanced';save();render();return;}
 if(act==='pass'){passQuestion();return;}
 if(act==='resume-deferred'){resumeDeferred();return;}
 notice='';
 if(act==='level'){const n=Number(val);if(n>=1&&n<=unlockedLevel()){state.playLevel=n;save();active=null;session={count:0,total:10,gained:0,done:false,perfect:0};view='play';next();}return;}
 if(act==='quick-play'){quickPlay();return;}
 if(act==='export'||act==='logout'){profileAction(act);return;}
 if(act==='start'){modalStart();return;}
 if(act==='all-interests'){state.interests=Object.keys(DOMAINS);modalStart();return;}
 if(act==='interest'){toggleInterest(val);return;}
 if(act==='interests'){editingInterests=true;render();return;}
 if(act==='view'){editingInterests=false;profileMessage='';view=val;if(view==='play'&&state.onboardingDone&&!active&&!session.done)next();else render();return;}
 if(act==='mode'){state.mode=val;save();render();return;}
 if(act==='domain'){state.onboardingDone=true;save();chosenDomain=val;view='play';session={count:0,total:10,gained:0,done:false,perfect:0};next();return;}
 if(act==='spot'){chooseSpot(Number(val));return;}
 if(act==='fix'){chooseFix(val);return;}
 if(act==='rule'){chooseRule(val);return;}
 if(act==='hint'&&active&&active.step!=='result'){active.hints=Math.min(2,active.hints+1);render();return;}
 if(act==='skip'){revealSolution();return;}
 if(act==='next'){next();return;}
 if(act==='new-session'){deferred.clear();session={count:0,total:10,gained:0,done:false,perfect:0};next();return;}
 if(act==='reset'){if(confirm('Azzera i progressi di questo percorso? Gli altri profili restano conservati. Esporta prima una copia se vuoi recuperarli.')){state=structuredClone(INITIAL);pendingInvitation='';deferred.clear();save();active=null;session={count:0,total:10,gained:0,done:false,perfect:0};editingInterests=false;view='play';render()}return;}
});
document.getElementById('app').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,kind=form.dataset.form;if(!kind||busy)return;const values=fields(form);busy=true;profileMessage='';form.querySelector('button').disabled=true;try{if(kind==='feedback-import')await importFeedback(form);if(kind==='guest-name')chooseGuestName(values);if(kind==='register')await registerProfile(values);if(kind==='login')await loginProfile(values);if(kind==='import')await importProfile(form,values);}catch(err){profileMessage=err.message||'Operazione non riuscita. Riprova.';}finally{busy=false;render();}});
document.addEventListener('visibilitychange',tickClock);
persistVault();render();
</script>
</body></html>
