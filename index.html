const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));

let state=load();

function esc(t){return String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function shuffle(a){let arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function history(d){return state.history.filter(x=>x.domain===d)}
function mastery(d){const a=history(d).slice(-15);const prior=3*45;return Math.round((prior+a.reduce((s,p)=>s+p.quality,0))/(3+a.length))}
function title(){const ranks=[[0,'Curioso'],[110,'Esploratore'],[300,'Cercatore'],[560,'Intuitivo'],[850,'Decifratore'],[1200,'Visionario'],[1600,'Cartografo'],[2050,'Maestro degli schemi']];return ranks.filter(r=>state.xp>=r[0]).slice(-1)[0][1]}
function xpNext(){const t=[110,300,560,850,1200,1600,2050];return t.find(x=>x>state.xp)||null}
function progress(d){return Object.keys(state.completed).filter(id=>id.startsWith(d+'-')).length}
function instinctCount(){return state.history.filter(x=>x.intuition && x.spot).length}
function dname(d){return DOMAINS[d]?.name||d}
function choosePuzzle(){
  let domains=chosenDomain==='mix'?(state.interests.length?state.interests:Object.keys(DOMAINS)):[chosenDomain];
  let all=PUZZLES.filter(p=>domains.includes(p.domain));
  let fresh=all.filter(p=>!state.completed[p.id]);
  const replay=fresh.length===0;
  if(!replay && state.history.length===0 && domains.includes('numeri')){
    const intro=fresh.find(p=>p.id==='numeri-01');if(intro) return {p:intro,replay:false};
  }
  let list=fresh.length?fresh:all;
  const weights=list.map(p=>{
     const count=history(p.domain).length;
     const aim=count<2?1.5:count<4?2.5:1+mastery(p.domain)/30;
     return 1/(1+Math.abs(aim-p.level)*1.6);
  });
  let total=weights.reduce((a,b)=>a+b,0);let roll=Math.random()*total;
  for(let i=0;i<list.length;i++){roll-=weights[i];if(roll<=0)return {p:list[i],replay}}
  return {p:list[list.length-1],replay};
}
function next(){
  if(session.count>=session.total){active=null;session.done=true;render();return;}
  const {p,replay}=choosePuzzle();
  let mapped=p.items.map((text,original)=>({text,original}));if(!p.ordered)mapped=shuffle(mapped);
  let other=shuffle(PUZZLES.filter(x=>x.domain===p.domain&&x.id!==p.id&&x.rule!==p.rule)).slice(0,2).map(x=>x.rule);
  let options=shuffle([p.rule,...other]);
  active={p,replay,items:mapped,step:'spot',hints:0,intuition:false,mistakes:0,fixMistakes:0,ruleMistakes:0,spot:false,fix:false,rule:false,skipped:false,message:'',options,earned:0};
  render();
}
function markDone(){
  if(!active||active.step==='result')return;
  const a=active,p=a.p;
  const cleanSpot=a.spot&&a.mistakes===0;
  let quality=0;
  if(a.spot)quality+=cleanSpot?40:25;
  if(a.fix)quality+=a.fixMistakes===0?25:15;
  if(a.rule)quality+=a.ruleMistakes===0?25:15;
  if(a.spot&&a.fix&&a.hints===0)quality+=10;
  quality=Math.min(100,Math.round(quality*(1+0.035*(p.level-1))));
  let pts=a.skipped?4:(a.spot?10:0)+(a.fix?10:0)+(a.rule?10:0)+(a.intuition&&a.spot?5:0)+(a.hints===0&&a.spot?5:0);
  if(state.mode==='sfida'&&!a.skipped&&a.hints===0&&a.spot&&a.fix&&a.rule)pts+=5;
  if(a.replay)pts=0;
  a.earned=pts;
  if(!state.completed[p.id]){
    state.completed[p.id]=true;
    state.xp+=pts;
    state.history.push({id:p.id,domain:p.domain,quality,level:p.level,spot:a.spot,fix:a.fix,rule:a.rule,intuition:a.intuition&&a.spot,hints:a.hints,skipped:a.skipped,xp:pts,date:new Date().toISOString()});
    save();
  }
  session.count++;
  session.gained+=pts;
  if(a.spot&&a.fix&&a.rule&&a.hints===0&&a.mistakes+a.fixMistakes+a.ruleMistakes===0)session.perfect++;
  a.step='result';render();
}
function chooseSpot(original){if(!active||active.step!=='spot')return;
  const a=active;
  if(a.p.wrong.includes(original)){a.spot=true;a.step='fix';a.message='Hai individuato l’anomalia. Ora prova a riparare la sequenza.'}
  else{a.mistakes++;a.message='Non è l’elemento che rompe il collegamento. Puoi riprovare o chiedere un indizio.'}
  render();
}
function chooseFix(value){if(!active||active.step!=='fix')return;const a=active;
  if(value===a.p.correct){a.fix=true;a.step='rule';a.message='Correzione riuscita. Qual è la regola che tiene insieme gli elementi?'}
  else{a.fixMistakes++;a.message='Questa sostituzione non ricrea lo schema previsto. Riprova o chiedi un indizio.'}
  render();
}
function chooseRule(rule){if(!active||active.step!=='rule')return;const a=active;
  if(rule===a.p.rule){a.rule=true;markDone()}
  else{a.ruleMistakes++;a.message='Non è la regola del quesito. Puoi riprovare oppure scoprire la spiegazione.';render()}
}

function onboarding(){return `${header()}<div class="hero"><div><div class="section-kicker">Il primo passo</div><h1 class="section-heading">Quanto conosci ciò che ami?</h1><p class="lead">Otto elementi. Un collegamento nascosto. Qualcosa non torna. Scoprilo, correggilo e costruisci la tua mappa personale.</p></div><div class="hero-graphic" aria-hidden="true"><span>8</span><i></i></div></div><section class="card"><div class="section-kicker">Personalizza la tua esperienza</div><h2>Scegli gli argomenti che ti incuriosiscono</h2><p class="muted">Non è un test d’ingresso. Puoi cambiare tutto in qualsiasi momento, e anche scegliere soltanto un settore.</p><div class="interest-grid">${Object.entries(DOMAINS).map(([d,m])=>`<button class="interest-btn ${state.interests.includes(d)?'selected':''}" data-action="interest" data-val="${d}" aria-pressed="${state.interests.includes(d)}"><span class="sect-icon">${m.symbol}</span><span><b>${m.name}</b><small>${m.intro}</small></span></button>`).join('')}</div><div class="actionrow"><button class="btn primary" data-action="start">Cominciamo →</button><button class="btn soft" data-action="all-interests">Sorprendimi con tutti i settori</button></div></section>`}
function modeBar(){return `<div class="label" style="margin:14px 0 9px">Modalità</div><div class="mode-row">${[['relax','☁ Relax'],['esplora','◎ Esplora'],['sfida','⚑ Sfida personale']].map(([val,label])=>`<button class="btn ${state.mode===val?'selected':''}" data-action="mode" data-val="${val}" aria-pressed="${state.mode===val}">${label}</button>`).join('')}</div><p class="tiny">${state.mode==='relax'?'Senza timer e senza penalità.':state.mode==='esplora'?'Osserva le connessioni e amplia la tua mappa.':'Bonus esperienza per una soluzione completa senza indizi. Nessuna classifica online.'}</p>`}
function sidePanel(){const nextXP=xpNext();return `<aside class="card secondary"><div class="side-head"><h2 class="side-title">Il tuo percorso</h2><span class="label">personale</span></div><div class="statrow"><div class="statbox"><big>${Object.keys(state.completed).length}</big><span>enigmi esplorati</span></div><div class="statbox"><big>${instinctCount()}</big><span>intuizioni corrette</span></div></div><div class="smallrow"><span>Grado: <strong>${esc(title())}</strong></span><span>${nextXP?`${nextXP-state.xp} XP al prossimo`:'Grado massimo'}</span></div><div class="bar"><i style="width:${nextXP?Math.max(3,state.xp/nextXP*100):100}%"></i></div><h3 style="font-size:15px;margin:22px 0 9px">Competenze in esplorazione</h3>${Object.entries(DOMAINS).slice().sort((a,b)=>history(b[0]).length-history(a[0]).length).slice(0,5).map(([d,m])=>`<div class="metric"><div class="smallrow"><span>${m.symbol} ${m.name}</span><strong>${history(d).length?mastery(d)+'/100':'Da esplorare'}</strong></div><div class="bar"><i style="width:${history(d).length?mastery(d):0}%"></i></div></div>`).join('')}<p class="aside-note">La padronanza è una stima basata sulle prove giocate; non misura il QI. Salvataggio automatico qui. Trasferisci il percorso da «Il mio profilo».</p><button class="btn" data-action="view" data-val="map">Apri la mappa →</button></aside>`}
function questionStep(){const a=active,p=a.p;const stepIdx=['spot','fix','rule','result'].indexOf(a.step);const msg=a.step==='spot'?'Tocca l’elemento che non appartiene allo stesso schema degli altri.':a.step==='fix'?'Quale elemento inseriresti al suo posto?':a.step==='rule'?'Prova a riconoscere il collegamento nascosto.':'Ecco il collegamento che rende coerente la sequenza.';
 let mid='';
 if(a.step==='spot')mid=`<div class="tiles">${a.items.map(({text,original})=>`<button class="tile" data-action="spot" data-val="${original}" aria-label="Scegli ${esc(text)}">${esc(text)}</button>`).join('')}</div><div class="actionrow"><button class="btn ${a.intuition?'selected':''}" data-action="intuition" aria-pressed="${a.intuition}">✦ ${a.intuition?'Scelto d’istinto':'Lo sento d’istinto'}</button><span class="tiny">Puoi indicarlo prima della risposta.</span></div>`;
 else if(a.step==='fix')mid=`<div class="tiles">${a.items.map(({text,original})=>`<div class="tile ${p.wrong.includes(original)?'wrong':'locked'}" style="display:grid;place-items:center;text-align:center" aria-label="${esc(text)}">${esc(text)}</div>`).join('')}</div><div class="label">Quale sostituzione funziona?</div><div class="answers">${shuffle(p.choices).map(c=>`<button class="answer" data-action="fix" data-val="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
 else if(a.step==='rule')mid=`<div class="label" style="margin-top:22px">Scegli la spiegazione</div><div class="answers">${a.options.map((r,i)=>`<button class="answer wide withbadge" data-action="rule" data-val="${esc(r)}"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(r)}</button>`).join('')}</div>`;
 else mid=`<div class="success"><div class="section-kicker">Schema scoperto</div><h3>${esc(p.rule)}</h3><p>${esc(p.why)}</p><div class="pill" style="display:inline-block">+${a.earned} XP ${a.replay?' · ripasso senza nuovi punti':''}</div></div><div class="statrow"><div class="statbox"><big>${a.spot?'✓':'—'}</big><span>anomalia riconosciuta</span></div><div class="statbox"><big>${a.intuition&&a.spot?'✦':'—'}</big><span>intuizione dichiarata</span></div></div><button class="btn primary" data-action="next">${session.count>=session.total?'Vedi il riepilogo →':'Prossima sfida →'}</button>`;
 return `<section class="card"><div class="toolbar"><span class="label">${esc(dname(p.domain))} · difficoltà ${p.level}/5 ${a.replay?'· ripasso':''}</span><span class="label">Sfida ${Math.min(session.count+(a.step==='result'?0:1),session.total)} / ${session.total}</span></div><div class="stepper" aria-label="Progressione: anomalia, sostituzione, regola">${[0,1,2].map((n)=>`<div class="step ${stepIdx>n?'ok':stepIdx===n?'current':''}"></div>`).join('')}</div><h2 class="quiz-question">${a.step==='spot'?'Cosa c’è di sbagliato?':a.step==='fix'?'Come lo correggeresti?':a.step==='rule'?'Qual è la regola nascosta?':'Adesso tutto torna.'}</h2><p class="quiz-sub">${msg}</p>${a.message&&a.step!=='result'?`<div class="message ${a.mistakes+a.fixMistakes+a.ruleMistakes>0?'warn':''}" role="status">${esc(a.message)}</div>`:''}${mid}${a.step!=='result'?`<div class="actionrow">${a.hints<2?`<button class="btn" data-action="hint">◇ Un indizio (${a.hints}/2)</button>`:''}<button class="btn soft" data-action="skip">Scopri la soluzione</button></div>${a.hints>0?`<div class="hintbox"><b>Indizio ${a.hints}:</b> ${esc(p.hints[a.hints-1])}</div>`:''}`:''}</section>`
}
function game(){if(session.done)return `<div class="card session-done"><div class="section-kicker">Una tappa completata</div><h1 class="section-heading">Hai esplorato ${session.count} collegamenti.</h1><p class="outro">Ogni enigma è una piccola scoperta. Puoi continuare con i tuoi settori oppure provare qualcosa di nuovo.</p><div class="statrow"><div class="statbox"><big>+${session.gained}</big><span>XP in questa sessione</span></div><div class="statbox"><big>${session.perfect}</big><span>soluzioni complete senza errori</span></div></div><div class="actionrow" style="justify-content:center"><button class="btn primary" data-action="new-session">Altre 10 sfide →</button><button class="btn" data-action="view" data-val="map">Esplora la tua mappa</button></div></div>`;
 if(!active){next();}
 return `<div class="section-kicker">Allenati a vedere oltre</div><h1 class="section-heading" style="margin-bottom:9px">C’è qualcosa che non torna.</h1><p class="lead">Non conosci la regola. Devi scoprirla.</p><div class="toolbar" style="margin-top:20px"><div class="mode-row" style="margin:0"><button class="btn ${chosenDomain==='mix'?'selected':''}" data-action="domain" data-val="mix">Misto</button>${Object.entries(DOMAINS).filter(([d])=>state.interests.includes(d)).map(([d,m])=>`<button class="btn ${chosenDomain===d?'selected':''}" data-action="domain" data-val="${d}">${m.name}</button>`).join('')}</div></div><div class="content-grid"><div><div class="card" style="padding:14px 20px;margin-bottom:15px">${modeBar()}</div>${questionStep()}</div>${sidePanel()}</div>`;
}
function mapView(){return `<div class="section-kicker">Il tuo atlante personale</div><h1 class="section-heading">La mappa delle tue competenze.</h1><p class="lead">Un ritratto delle tue prestazioni nel gioco, non un giudizio sulle tue capacità o sul tuo valore.</p><div class="statrow" style="max-width:590px"><div class="statbox"><big>${state.xp}</big><span>esperienza accumulata</span></div><div class="statbox"><big>${instinctCount()}</big><span>intuizioni riconosciute</span></div></div><div class="map-grid">${Object.entries(DOMAINS).map(([d,m])=>`<div class="map-card"><div class="map-top"><span class="sect-icon">${m.symbol}</span><span class="circle-score">${history(d).length?mastery(d)+'<small style="font-size:11px;color:#a1c69e">/100</small>':'—'}</span></div><h2 style="margin:17px 0 0">${m.name}</h2><p>${m.intro}</p><div class="smallrow"><span>${progress(d)} enigmi visti / ${PUZZLES.filter(p=>p.domain===d).length}</span><span>${history(d).length} prove · stima ${history(d).length<5?'iniziale':'nel gioco'}</span></div><div class="bar"><i style="width:${history(d).length?mastery(d):0}%"></i></div><button class="btn" data-action="domain" data-val="${d}">Gioca in ${m.name} →</button></div>`).join('')}</div><div class="details"><h3>Come leggere questi valori</h3><p class="muted">L’esperienza aumenta quando scopri nuovi enigmi. La padronanza è una stima prudente delle risposte, degli indizi usati e della difficoltà affrontata, aggiornata per settore. Con poche prove è indicativa, non diagnostica. Le intuizioni vengono contate solo se le dichiari prima della risposta e individui l’anomalia.</p><button class="btn corally" data-action="reset">Azzera i progressi su questo dispositivo</button></div>`}
function aboutView(){return `<div class="section-kicker">Le regole del mondo STONA</div><h1 class="section-heading">Non sapere la risposta è parte del gioco.</h1><p class="lead">Un cruciverba d’intuizione: chiunque può esplorare, e nessuno viene giudicato per una risposta sbagliata.</p><div class="map-grid"><div class="card"><div class="section-kicker">01 · Guarda</div><h2>Trova l’anomalia</h2><p class="muted">Otto elementi sono mostrati senza categoria dichiarata. Trova quello che non si accorda con gli altri.</p></div><div class="card"><div class="section-kicker">02 · Ripara</div><h2>Sostituiscilo</h2><p class="muted">Scegli una sostituzione coerente. Nella versione finale potranno essere accettate più correzioni diverse.</p></div><div class="card"><div class="section-kicker">03 · Comprendi</div><h2>Scopri il filo nascosto</h2><p class="muted">Individua la regola, oppure leggi la spiegazione senza alcuna penalizzazione emotiva.</p></div><div class="card"><div class="section-kicker">✦ · Intuizione</div><h2>«Lo sento d’istinto»</h2><p class="muted">Dichiara la scelta istintiva prima di indicare l’anomalia: il gioco registrerà quante intuizioni sono corrette, senza attribuirti un QI.</p></div></div><div class="details"><h3>Cosa esiste in questa versione</h3><p class="muted">96 enigmi in 8 settori, livelli 1–5, interessi personalizzabili, 2 indizi per enigma, 3 modalità, sessioni di 10 sfide, esperienza persistente, mappa e padronanza stimata per settore. I progressi si salvano nel browser. Puoi proteggerli con un profilo facoltativo ed esportarli in un file cifrato per importarli altrove. La modalità «Sfida personale» non è una classifica online.</p><p class="muted"><b>In progetto:</b> 20 settori, contenuti visivi e audio, regole alternative validate, accessibilità avanzata, motore di generazione con controllo di qualità, sfide tra amici e sincronizzazione tra dispositivi.</p><button class="btn primary" data-action="view" data-val="play">Torna alle sfide →</button></div>`}
function welcome(){return `<section class="welcome"><div class="section-kicker">96 enigmi · 8 mondi · Il tuo istinto</div><h1 class="section-heading">Qualcosa stona.<br>Tu lo vedi?</h1><p class="lead">Otto elementi. Un filo nascosto. Trova quello fuori posto, correggilo e scopri il perché.</p><div class="preview-tiles" aria-hidden="true">${['3','2','6','4','5','7','9','5'].map(x=>`<span>${x}</span>`).join('')}</div><div class="actionrow welcome-actions"><button class="btn primary" data-action="quick-play">Gioca subito →</button><button class="btn soft" data-action="view" data-val="profile">Ho un profilo / Importa</button></div><p class="save-note">Nessuna registrazione. Nessuna installazione. I progressi si salvano mentre giochi.</p><div class="details"><strong>Un minuto per entrare nel gioco.</strong><p class="muted" style="margin:8px 0 0">Tocca ciò che non torna. Se serve, chiedi un indizio. Il nome e la password possono aspettare.</p></div></section>`;}
function render(){const app=document.getElementById('app');let content;if(editingInterests)content=onboarding().replace(header(),'');else if(view==='profile')content=profileView();else if(!state.onboardingDone&&view==='play')content=welcome();else content=view==='map'?mapView():view==='about'?aboutView():game();
 app.innerHTML=`<div class="app">${header()}${navbar()}${storageError?`<div class="status-error" role="alert">${esc(storageError)}</div>`:''}<main id="main" tabindex="-1" class="${busy?'busy':''}">${content}</main><footer class="footer">STONA · Alpha 0.2 · 96 enigmi · Nessuna registrazione obbligatoria. Profili e progressi restano nel browser; trasferimento tramite file da «Il mio profilo». Nessun tracciamento.</footer></div>`;
}
function quickPlay(){if(!state.onboardingDone){state.onboardingDone=true;save();}editingInterests=false;view='play';if(!active&&!session.done)next();else render();}
document.getElementById('app').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const act=b.dataset.action,val=b.dataset.val;
 if(busy)return;
 if(act==='quick-play'){quickPlay();return;}
 if(act==='export'||act==='logout'){profileAction(act);return;}
 if(act==='start'){modalStart();return;}
 if(act==='all-interests'){state.interests=Object.keys(DOMAINS);modalStart();return;}
 if(act==='interest'){toggleInterest(val);return;}
 if(act==='interests'){editingInterests=true;render();return;}
 if(act==='view'){editingInterests=false;profileMessage='';view=val;if(view==='play'&&state.onboardingDone&&!active&&!session.done)next();else render();return;}
 if(act==='mode'){state.mode=val;save();render();return;}
 if(act==='domain'){state.onboardingDone=true;save();chosenDomain=val;view='play';session={count:0,total:10,gained:0,done:false,perfect:0};next();return;}
 if(act==='spot'){chooseSpot(Number(val));return;}
 if(act==='fix'){chooseFix(val);return;}
 if(act==='rule'){chooseRule(val);return;}
 if(act==='intuition'&&active&&active.step==='spot'){active.intuition=!active.intuition;render();return;}
 if(act==='hint'&&active&&active.step!=='result'){active.hints=Math.min(2,active.hints+1);render();return;}
 if(act==='skip'){skip();return;}
 if(act==='next'){next();return;}
 if(act==='new-session'){session={count:0,total:10,gained:0,done:false,perfect:0};next();return;}
 if(act==='reset'){if(confirm('Azzera i progressi di questo percorso? Gli altri profili restano conservati. Esporta prima una copia se vuoi recuperarli.')){state=structuredClone(INITIAL);save();active=null;session={count:0,total:10,gained:0,done:false,perfect:0};editingInterests=false;view='play';render()}return;}
});
document.getElementById('app').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,kind=form.dataset.form;if(!kind||busy)return;const values=fields(form);busy=true;profileMessage='';form.querySelector('button').disabled=true;try{if(kind==='register')await registerProfile(values);if(kind==='login')await loginProfile(values);if(kind==='import')await importProfile(form,values);}catch(err){profileMessage=err.message||'Operazione non riuscita. Riprova.';}finally{busy=false;render();}});
persistVault();render();
</script>
</body></html>
