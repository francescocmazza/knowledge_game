<script>
'use strict';
const PACK = JSON.parse(document.getElementById('stona-data').textContent);
const DOMAINS=PACK.domains, PUZZLES=PACK.puzzles;
const VAULT_STORE='stona-kids-profiles-v1', FORMAT='stona-kids-profile', ITERATIONS=210000;
let storageError='', profileMessage='', busy=false, currentId='guest', currentKey=null, writeQueue=Promise.resolve();
function newId(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('')}
const freshState=()=>({xp:0,interests:Object.keys(DOMAINS),playLevel:1,mode:'relax',history:[],completed:{},onboardingDone:false});
function readVault(){try{const raw=localStorage.getItem(VAULT_STORE);if(raw){const v=JSON.parse(raw);if(v.version!==2||!v.guest||!Array.isArray(v.profiles))throw Error();return v;}}catch(e){storageError='Il salvataggio locale non è disponibile o non è leggibile. Esporta il profilo prima di chiudere la pagina.';}
 let old=null; // Kids starts with its own save: never read the classic game's legacy data.
 return {version:2,guest:{id:newId(),name:'Ospite',createdAt:new Date().toISOString(),state:old?normalizeState(old):freshState()},profiles:[]};}
function normalizeState(x){if(!x||typeof x!=='object'||!Array.isArray(x.history)||x.history.length>2000)throw Error('Progressi non validi.');
 const seen=new Set(), h=x.history.filter(r=>r&&PUZZLES.some(p=>p.id===r.id&&p.domain===r.domain)&&!seen.has(r.id)&&(seen.add(r.id)));
 for(const r of h){if(!Number.isFinite(r.quality)||r.quality<0||r.quality>100||!Number.isInteger(r.xp)||r.xp<0||r.xp>45||typeof r.date!=='string'||!Number.isFinite(Date.parse(r.date)))throw Error('Cronologia non valida.');}
 return {...freshState(),xp:h.reduce((n,r)=>n+r.xp,0),history:h.map(r=>({id:r.id,domain:r.domain,quality:r.quality,level:r.level,tierVersion:r.tierVersion===1?1:0,clean:r.clean===true,durationMs:Number.isFinite(r.durationMs)&&r.durationMs>=0?r.durationMs:null,spot:!!r.spot,fix:!!r.fix,rule:!!r.rule,intuition:!!r.intuition,hints:Math.max(0,Math.min(2,Number(r.hints)||0)),skipped:!!r.skipped,xp:r.xp,date:r.date})),completed:Object.fromEntries(h.map(r=>[r.id,true])),interests:Array.isArray(x.interests)&&x.interests.filter(d=>DOMAINS[d]).length?Array.from(new Set(x.interests.filter(d=>DOMAINS[d]))):freshState().interests,mode:['relax','esplora','sfida'].includes(x.mode)?x.mode:'relax',playLevel:Number.isInteger(x.playLevel)&&x.playLevel>=1&&x.playLevel<=4?x.playLevel:1,onboardingDone:!!x.onboardingDone};}
let vault=readVault();
function persistVault(){try{localStorage.setItem(VAULT_STORE,JSON.stringify(vault));storageError='';return true}catch(e){storageError='Non riesco a salvare su questo browser. Mantieni aperta la pagina ed esporta il profilo.';return false}}
function load(){return normalizeState(vault.guest.state)}
function currentProfile(){return currentId==='guest'?vault.guest:vault.profiles.find(p=>p.id===currentId)}
function save(){const snapshot=structuredClone(state);if(currentId==='guest'){vault.guest.state=snapshot;persistVault();return writeQueue;}
 const record=currentProfile(),key=currentKey;
 writeQueue=writeQueue.catch(()=>{}).then(async()=>{const sealed=await seal({id:record.id,name:record.username,createdAt:record.createdAt,state:snapshot},key,record.salt);Object.assign(record,sealed,{updatedAt:new Date().toISOString()});if(!persistVault())throw Error(storageError)}).catch(e=>{storageError=e.message||'Salvataggio non riuscito. Esporta il profilo.';render();});return writeQueue;}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function unb64(s){if(typeof s!=='string'||s.length>1500000)throw Error('File non valido.');return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function derive(password,salt){if(!crypto.subtle)throw Error('Per proteggere il profilo apri il gioco dal link HTTPS.');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:ITERATIONS,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(payload,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:new TextEncoder().encode(FORMAT+':2')},key,new TextEncoder().encode(JSON.stringify(payload)));return {salt,iv:b64(iv),data:b64(data)}}
function checkEnvelope(e){if(!e||e.format!==FORMAT||e.version!==2||e.iterations!==ITERATIONS||unb64(e.salt).length!==16||unb64(e.iv).length!==12||unb64(e.data).length<16)throw Error('Questo non è un profilo Stona Kids. I profili di STONA classico sono separati.');}
async function openEnvelope(e,password){checkEnvelope(e);const key=await derive(password,e.salt);let payload;try{payload=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv),additionalData:new TextEncoder().encode(FORMAT+':2')},key,unb64(e.data))))}catch(err){throw Error('Password errata oppure file danneggiato. Riprova.');}
 if(typeof payload.id!=='string'||payload.id.length>80||typeof payload.name!=='string'||!validName(payload.name)||typeof payload.createdAt!=='string')throw Error('Profilo non valido.');payload.state=normalizeState(payload.state);return {payload,key};}
function envelope(record){return {format:FORMAT,version:2,iterations:ITERATIONS,salt:record.salt,iv:record.iv,data:record.data}}
function validName(n){return /^[\p{L}\p{N}_ .-]{2,24}$/u.test(n)}
function nameKey(n){return n.trim().normalize('NFKC').toLocaleLowerCase('it-IT')}
function fields(form){return Object.fromEntries(new FormData(form))}
function resetRound(){active=null;session={count:0,total:10,gained:0,done:false,perfect:0};chosenDomain='mix';editingInterests=false;}
function activate(id,key,data){currentId=id;currentKey=key;state=structuredClone(data);resetRound();view='profile';}
async function registerProfile(values){const name=String(values.username||'').trim().normalize('NFKC'),password=String(values.password||'');if(!validName(name))throw Error('Usa un nome da 2 a 24 caratteri: lettere, numeri, spazi, punto, trattino o _.');if(password.length<4||password.length>200)throw Error('Scegli una password da 4 a 200 caratteri.');if(vault.profiles.some(p=>nameKey(p.username)===nameKey(name)))throw Error('Questo nome è già presente qui. Usa Accedi o scegli un altro nome.');if(vault.profiles.length>=20)throw Error('Hai già 20 profili su questo browser.');
 await writeQueue;const salt=b64(crypto.getRandomValues(new Uint8Array(16))),key=await derive(password,salt),record={id:newId(),username:name,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};const progress=structuredClone(state);Object.assign(record,await seal({id:record.id,name,createdAt:record.createdAt,state:progress},key,salt));vault.profiles.push(record);if(!persistVault()){vault.profiles.pop();downloadJSON(envelope(record),'STONA-Kids-profilo-backup.json');throw Error('Il browser non consente il salvataggio. Ho scaricato il profilo cifrato: conservalo e importalo su un browser che permetta i dati locali.');}vault.guest={id:newId(),name:'Ospite',createdAt:new Date().toISOString(),state:freshState()};persistVault();activate(record.id,key,progress);profileMessage='Profilo creato: i tuoi progressi sono stati conservati. Esporta una copia per portarli su un altro dispositivo.';}
async function loginProfile(values){await writeQueue;const record=vault.profiles.find(p=>nameKey(p.username)===nameKey(String(values.username||'')));if(!record)throw Error('Profilo non presente in questo browser. Su un nuovo dispositivo usa Importa profilo.');const {payload,key}=await openEnvelope(envelope(record),String(values.password||''));activate(record.id,key,payload.state);profileMessage='Bentornato, '+record.username+'.';}
function downloadJSON(content,name){const url=URL.createObjectURL(new Blob([JSON.stringify(content,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
async function exportProfile(){await save();await writeQueue;if(currentId==='guest'){profileMessage='Per creare il file protetto scegli un nome e una password qui sotto. I progressi dell’ospite verranno conservati.';render();return;}const r=currentProfile();const sealed=await seal({id:r.id,name:r.username,createdAt:r.createdAt,state:structuredClone(state)},currentKey,r.salt);downloadJSON(envelope({...r,...sealed}),'STONA-Kids-'+r.username.replace(/[^\p{L}\p{N}_-]/gu,'_')+'-'+new Date().toISOString().slice(0,10)+'.json');profileMessage='Copia scaricata. Su un altro computer apri Stona Kids → Il mio profilo → Importa profilo. Servirà la stessa password.';}
async function importProfile(form,values){const file=form.querySelector('[type=file]').files[0];if(!file)throw Error('Scegli il file JSON del tuo profilo.');if(file.size>1000000)throw Error('Il file è troppo grande. Scegli un file profilo Stona Kids.');let e;try{e=JSON.parse(await file.text())}catch(err){throw Error('Il file non è un JSON leggibile.');}const {payload,key}=await openEnvelope(e,String(values.password||''));await writeQueue;
 const same=vault.profiles.find(p=>p.id===payload.id),collision=vault.profiles.find(p=>p.id!==payload.id&&nameKey(p.username)===nameKey(payload.name));if(collision)throw Error('Su questo browser esiste un altro profilo con lo stesso nome. Usa un browser diverso per importare questo file.');let merged=payload.state;
 if(same){const old=await openEnvelope(envelope(same),String(values.password||''));const byId=new Map(old.payload.state.history.map(r=>[r.id,r]));for(const r of payload.state.history)if(!byId.has(r.id))byId.set(r.id,r);merged=normalizeState({...payload.state,history:[...byId.values()].sort((a,b)=>a.date.localeCompare(b.date)),onboardingDone:old.payload.state.onboardingDone||payload.state.onboardingDone});}
 if(!same&&vault.profiles.length>=20)throw Error('Hai già 20 profili su questo browser.');const record={id:payload.id,username:payload.name,createdAt:payload.createdAt,updatedAt:new Date().toISOString(),...await seal({...payload,state:merged},key,e.salt)};const previous=structuredClone(vault.profiles);if(same)Object.assign(same,record);else vault.profiles.push(record);if(!persistVault()){vault.profiles=previous;throw Error(storageError);}activate(record.id,key,merged);profileMessage='Profilo importato. Puoi riprendere a giocare: '+Object.keys(state.completed).length+' enigmi conservati.';}
function profileView(){const r=currentProfile(),named=currentId!=='guest';return `<div class="section-kicker">Il tuo spazio</div><h1 class="section-heading">${named?'Ciao, '+esc(r.username)+'.':'Gioca ora. Conserva quando vuoi.'}</h1><p class="lead">${named?'Il profilo è protetto da password. Per continuare altrove, esportalo e importalo con la stessa password.':'I progressi dell’ospite si salvano qui, senza registrazione. Puoi trasformarli in un profilo quando vuoi.'}</p>${profileMessage?`<div class="banner" role="status">${esc(profileMessage)}</div>`:''}<div class="statrow"><div class="statbox"><big>${state.xp}</big><span>XP personali · ${esc(title())}</span></div><div class="statbox"><big>${Object.keys(state.completed).length} / ${PUZZLES.length}</big><span>enigmi esplorati</span></div></div><div class="actionrow" style="margin-bottom:24px"><button class="btn primary" data-action="quick-play">${state.history.length?'Continua a giocare':'Gioca subito'} →</button><button class="btn" data-action="view" data-val="map">La mia mappa</button>${named?'<button class="btn" data-action="export">Esporta profilo ↓</button><button class="btn soft" data-action="logout">Esci dal profilo</button>':''}</div><div class="map-grid">${!named?`<section class="card"><h2>Conserva il tuo percorso</h2><p class="muted">Solo un soprannome e una password. Non inserire nome e cognome: i punti dell’ospite diventano tuoi.</p><form data-form="register"><label>Soprannome<input name="username" autocomplete="username" minlength="2" maxlength="24" required placeholder="Scegli un soprannome"></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="4" maxlength="200" required placeholder="Almeno 4 caratteri"></label><p class="tiny">Conserva la password: in questa alpha non c’è recupero via email.</p><button class="btn primary" ${busy?'disabled':''}>Crea profilo e conserva i punti</button></form></section><section class="card"><h2>Hai già un profilo qui?</h2><p class="muted">Accedi a uno dei profili salvati su questo browser.</p><form data-form="login"><label>Soprannome<input name="username" autocomplete="username" required maxlength="24" list="local-names"></label><datalist id="local-names">${vault.profiles.map(p=>`<option value="${esc(p.username)}"></option>`).join('')}</datalist><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button class="btn" ${busy?'disabled':''}>Accedi</button></form><p class="tiny">Se sei su un altro computer, importa il tuo file qui sotto.</p></section>`:`<section class="card"><h2>Il tuo profilo, in tasca</h2><p class="muted">Esporta dopo aver giocato. Porta il file sul nuovo dispositivo e importalo con la tua password.</p><button class="btn primary" data-action="export">Scarica il profilo JSON ↓</button><p class="tiny">Il file è cifrato. La password non viene inserita nel file.</p></section><section class="card"><h2>I tuoi ultimi passi</h2>${state.history.slice(-5).reverse().map(x=>`<div class="smallrow"><span>${esc(dname(x.domain))} · ${new Date(x.date).toLocaleDateString('it-IT')}</span><strong>+${x.xp} XP</strong></div>`).join('')||'<p class="muted">La tua prima scoperta ti aspetta.</p>'}<p class="tiny">La mappa descrive le prove svolte nel gioco.</p></section>`}<section class="card"><h2>Importa profilo</h2><p class="muted">Arrivi da un altro dispositivo? Scegli il file esportato e inserisci la sua password. Un backup precedente dello stesso profilo viene unito ai progressi già presenti, senza duplicare punti.</p><form data-form="import"><label>File profilo JSON<input name="file" type="file" accept=".json,application/json" required></label><label>Password del file<input name="password" type="password" autocomplete="off" maxlength="200" required></label><button class="btn" ${busy?'disabled':''}>Importa e continua →</button></form></section><section class="card"><h2>Come restano i progressi</h2><p class="muted">Salvataggio automatico su questo browser dopo ogni enigma. Nessuna email, nessuna installazione.</p><p class="tiny">Non c’è sincronizzazione automatica tra computer. Prima di cancellare i dati del browser, esporta il profilo. Su un dispositivo condiviso, premi Esci dal profilo.</p><button class="btn soft" data-action="interests">Personalizza gli interessi</button><button class="btn soft" data-action="reset">Azzera questo percorso</button></section></div>`;}
async function profileAction(action){if(busy)return;busy=true;profileMessage='';try{if(action==='export')await exportProfile();if(action==='logout'){await save();await writeQueue;if(storageError)throw Error(storageError);activate('guest',null,vault.guest.state);profileMessage='Profilo chiuso. Puoi accedere di nuovo con nome e password.';}}catch(e){profileMessage=e.message}finally{busy=false;render();}}

const INITIAL=freshState();
let state=load();
let view='play', chosenDomain='mix', editingInterests=false, active=null, session={count:0,total:10,gained:0,done:false,perfect:0};
let notice='';
function esc(t){return String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function shuffle(a){let arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function history(d){return state.history.filter(x=>x.domain===d)}
function mastery(d){const a=history(d).slice(-15);const prior=3*45;return Math.round((prior+a.reduce((s,p)=>s+p.quality,0))/(3+a.length))}
function title(){const ranks=[[0,'Curioso'],[110,'Esploratore'],[300,'Cercatore'],[560,'Intuitivo'],[850,'Decifratore'],[1200,'Visionario'],[1600,'Cartografo'],[2050,'Maestro degli schemi']];return ranks.filter(r=>state.xp>=r[0]).slice(-1)[0][1]}
function xpNext(){const t=[110,300,560,850,1200,1600,2050];return t.find(x=>x>state.xp)||null}
function progress(d){return Object.keys(state.completed).filter(id=>id.startsWith(d+'-')).length}
function solvedCount(){return state.history.filter(x=>x.spot&&x.fix&&x.rule).length}
function dname(d){return DOMAINS[d]?.name||d}
const LEVELS=['','Primi passi','Caccia agli indizi','Connessioni','Super sfide'];
function levelCredits(level){const seen=new Set();return state.history.reduce((n,r)=>{if(r.tierVersion!==1||r.level!==level||!r.clean||seen.has(r.id))return n;seen.add(r.id);return n+(r.durationMs!==null&&r.durationMs<=60000?2:1)},0)}
function unlockedLevel(){let n=1;while(n<4&&levelCredits(n)>=4)n++;return n}
function playLevel(){return Math.min(state.playLevel||1,unlockedLevel())}
function tickClock(){if(!active)return;const now=Date.now();if(active.clockRunning)active.elapsedMs+=Math.max(0,now-active.clockSince);active.clockSince=now;active.clockRunning=view==='play'&&!editingInterests&&!document.hidden&&active.step!=='result';}
function choosePuzzle(){
 const domains=chosenDomain==='mix'?(state.interests.length?state.interests:Object.keys(DOMAINS)):[chosenDomain];
 const all=PUZZLES.filter(p=>domains.includes(p.domain)&&p.level===playLevel());
 const fresh=all.filter(p=>!state.completed[p.id]);
 const pool=fresh.length?fresh:all;
 if(state.history.length===0&&!state.completed['numeri-01']&&domains.includes('numeri')&&playLevel()===1)return {p:PUZZLES.find(p=>p.id==='numeri-01'),replay:false};
 const list=pool.filter(p=>!active||p.id!==active.p.id);const candidates=list.length?list:pool;
 const p=candidates[Math.floor(Math.random()*candidates.length)];return {p,replay:!!state.completed[p.id]};
}

function next(){
  if(session.count>=session.total){active=null;session.done=true;render();return;}

  let other=p.level===1?['Sono tutti giorni della settimana.','Sono tutti mesi dell’anno.']:shuffle(PUZZLES.filter(x=>x.domain===p.domain&&x.level===p.level&&x.id!==p.id&&x.rule!==p.rule)).slice(0,2).map(x=>x.rule);
  let options=shuffle([p.rule,...other]);
  active={p,replay,items:mapped,step:'spot',hints:0,elapsedMs:0,clockSince:Date.now(),clockRunning:true,mistakes:0,fixMistakes:0,ruleMistakes:0,spot:false,fix:false,rule:false,skipped:false,message:'',options,earned:0};

function markDone(){
  if(!active||active.step==='result')return;
  tickClock();const a=active,p=a.p;const beforeUnlock=unlockedLevel();
  const cleanSpot=a.spot&&a.mistakes===0;
  let quality=0;
  if(a.spot)quality+=cleanSpot?40:25;
  if(a.fix)quality+=a.fixMistakes===0?25:15;
  if(a.rule)quality+=a.ruleMistakes===0?25:15;
  if(a.spot&&a.fix&&a.hints===0)quality+=10;
  quality=Math.min(100,Math.round(quality*(1+0.035*(p.level-1))));
  let pts=a.skipped?4:(a.spot?10:0)+(a.fix?10:0)+(a.rule?10:0)+(a.hints===0&&a.spot?5:0);
  if(state.mode==='sfida'&&!a.skipped&&a.hints===0&&a.spot&&a.fix&&a.rule)pts+=5;
  if(a.replay||state.completed[p.id])pts=0;
  a.earned=pts;
  if(!state.completed[p.id]){
    state.completed[p.id]=true;
    state.xp+=pts;
    state.history.push({id:p.id,domain:p.domain,quality,level:p.level,tierVersion:1,clean:!!(a.spot&&a.fix&&a.rule&&!a.skipped&&a.hints===0&&a.mistakes+a.fixMistakes+a.ruleMistakes===0),durationMs:Math.round(a.elapsedMs),spot:a.spot,fix:a.fix,rule:a.rule,hints:a.hints,skipped:a.skipped,xp:pts,date:new Date().toISOString()});
  }else if(a.spot&&a.fix&&a.rule&&!a.skipped&&a.hints===0&&a.mistakes+a.fixMistakes+a.ruleMistakes===0){
    const previous=state.history.find(r=>r.id===p.id);
    if(previous&&(previous.tierVersion!==1||!previous.clean))Object.assign(previous,{tierVersion:1,level:p.level,clean:true,durationMs:Math.round(a.elapsedMs),quality,spot:true,fix:true,rule:true,hints:0,skipped:false});
  }
  const unlocked=unlockedLevel();if(unlocked>beforeUnlock){a.unlocked=unlocked;if(state.playLevel===beforeUnlock)state.playLevel=unlocked;}
  save();
  session.count++;
  session.gained+=pts;
  if(a.spot&&a.fix&&a.rule&&a.hints===0&&a.mistakes+a.fixMistakes+a.ruleMistakes===0)session.perfect++;
  a.step='result';render();
}
function chooseSpot(original){if(!active||active.step!=='spot')return;
  const a=active;

  else{a.mistakes++;a.message='Non è l’elemento che rompe il collegamento. Puoi riprovare o chiedere un indizio.'}
  render();
}
function chooseFix(value){if(!active||active.step!=='fix')return;const a=active;
  if(value===a.p.correct){a.fix=true;a.step='rule';a.message='Correzione riuscita. Qual è la regola che tiene insieme gli elementi?'}
  else{a.fixMistakes++;a.message='Questa sostituzione non ricrea lo schema previsto. Riprova o chiedi un indizio.'}
  render();
}
function chooseRule(rule){if(!active||active.step!=='rule')return;const a=active;
  if(rule===a.p.rule){a.rule=true;markDone()}

}

function aboutView(){return `<div class="section-kicker">Come si gioca a Stona Kids</div><h1 class="section-heading">Non sapere la risposta è parte del gioco.</h1><p class="lead">Guarda, trova ciò che stona e scopri il collegamento. Se ti blocchi, puoi chiedere un indizio: sbagliare fa parte del gioco.</p><div class="map-grid"><div class="card"><div class="section-kicker">01 · Guarda</div><h2>Trova ciò che stona</h2><p class="muted">Otto elementi sono mostrati senza categoria dichiarata. Trova quello che non si accorda con gli altri.</p></div><div class="card"><div class="section-kicker">02 · Ripara</div><h2>Sostituiscilo</h2><p class="muted">Scegli una sostituzione coerente. Nella versione finale potranno essere accettate più correzioni diverse.</p></div><div class="card"><div class="section-kicker">03 · Comprendi</div><h2>Scopri il filo nascosto</h2><p class="muted">Individua la regola, oppure leggi la spiegazione senza perdere punti.</p></div><div class="card"><div class="section-kicker">🌟 · Il tuo ritmo</div><h2>Parti facile, poi esplora</h2><p class="muted">Quattro livelli. Una soluzione completa senza aiuti vale una stella; entro 60 secondi ne vale due. Quattro stelle nello stesso livello aprono il successivo. Nessuna penalità se rispondi con calma.</p></div></div><div class="details"><h3>Il tuo mondo Kids</h3><p class="muted">128 enigmi in 8 temi, 4 livelli progressivi, interessi personalizzabili, icone e immagini simboliche, 2 indizi per enigma, 3 modalità, sessioni di 10 sfide, esperienza persistente, mappa e progressi per tema. I progressi si salvano nel browser. Puoi proteggerli con un profilo facoltativo ed esportarli in un file cifrato per importarli altrove. La modalità «Sfida personale» non è una classifica online.</p><p class="muted">Among Us è un gioco di equipaggio e impostori: l’equipaggio completa compiti e cerca l’impostore. Qui trovi mini-missioni di logica inventate, non una partita online: non devi avere un account Among Us e tutti gli indizi sono nei tasselli.</p><button class="btn primary" data-action="view" data-val="play">Torna alle sfide →</button></div>`}
function welcome(){return `<section class="welcome kids-welcome"><div class="section-kicker">STONA KIDS · 8–14 ANNI</div><h1 class="section-heading">Otto mondi.<br>Un dettaglio che stona.</h1><p class="lead">Numeri, animali, spazio e una missione speciale Among Us. Trova l’elemento fuori posto, correggilo e scopri il perché!</p><div class="actionrow welcome-actions"><button class="btn primary" data-action="quick-play">Gioca subito →</button><button class="btn soft" data-action="view" data-val="profile">Il mio profilo / Importa</button></div><p class="save-note">Niente registrazione. Niente installazione. I tuoi progressi restano qui.</p><div class="kids-worlds">${Object.entries(DOMAINS).map(([d,m])=>`<button class="world-card" data-action="domain" data-val="${d}"><span class="world-icon" aria-hidden="true">${m.symbol}</span><strong>${m.name}</strong><small>${m.intro}</small></button>`).join('')}</div><div class="details"><strong>Parti facile. Poi scopri nuovi livelli.</strong><p class="muted" style="margin:8px 0 0">128 enigmi, 8 temi, 4 livelli. Nessun conto alla rovescia: una risposta giusta data con calma ti fa comunque avanzare. Puoi chiedere indizi o scoprire la soluzione.</p></div></section>`;}
function render(){tickClock();const app=document.getElementById('app');let content;if(editingInterests)content=onboarding().replace(header(),'');else if(view==='profile')content=profileView();else if(!state.onboardingDone&&view==='play')content=welcome();else content=view==='map'?mapView():view==='about'?aboutView():game();
 app.innerHTML=`<div class="app">${header()}${navbar()}${storageError?`<div class="status-error" role="alert">${esc(storageError)}</div>`:''}<main id="main" tabindex="-1" class="${busy?'busy':''}">${content}</main><footer class="footer">Stona Kids · Alpha 0.1 · 128 enigmi · Nessuna registrazione obbligatoria. Profili e progressi restano nel browser; trasferimento tramite file da «Il mio profilo». Nessun tracciamento. <a href="../">STONA classico</a> · Il tema Among Us è una creazione non ufficiale, senza collegamento al videogioco o a Innersloth.</footer></div>`;
}
function quickPlay(){if(!state.onboardingDone){state.onboardingDone=true;save();}editingInterests=false;view='play';if(!active&&!session.done)next();else render();}
document.getElementById('app').addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const act=b.dataset.action,val=b.dataset.val;
 if(busy)return;
 if(act==='level'){const n=Number(val);if(n>=1&&n<=unlockedLevel()){state.playLevel=n;save();active=null;session={count:0,total:10,gained:0,done:false,perfect:0};view='play';next();}return;}
 if(act==='quick-play'){quickPlay();return;}
 if(act==='export'||act==='logout'){profileAction(act);return;}
 if(act==='start'){modalStart();return;}
 if(act==='all-interests'){state.interests=Object.keys(DOMAINS);modalStart();return;}
 if(act==='interest'){toggleInterest(val);return;}
 if(act==='interests'){editingInterests=true;render();return;}
 if(act==='view'){editingInterests=false;profileMessage='';view=val;if(view==='play'&&state.onboardingDone&&!active&&!session.done)next();else render();return;}
 if(act==='mode'){state.mode=val;save();render();return;}
 if(act==='domain'){state.onboardingDone=true;save();chosenDomain=val;view='play';session={count:0,total:10,gained:0,done:false,perfect:0};next();return;}
 if(act==='spot'){chooseSpot(Number(val));return;}
 if(act==='fix'){chooseFix(val);return;}
 if(act==='rule'){chooseRule(val);return;}
 if(act==='hint'&&active&&active.step!=='result'){active.hints=Math.min(2,active.hints+1);render();return;}
 if(act==='skip'){skip();return;}
 if(act==='next'){next();return;}
 if(act==='new-session'){session={count:0,total:10,gained:0,done:false,perfect:0};next();return;}
 if(act==='reset'){if(confirm('Azzera i progressi di questo percorso? Gli altri profili restano conservati. Esporta prima una copia se vuoi recuperarli.')){state=structuredClone(INITIAL);save();active=null;session={count:0,total:10,gained:0,done:false,perfect:0};editingInterests=false;view='play';render()}return;}
});
document.getElementById('app').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,kind=form.dataset.form;if(!kind||busy)return;const values=fields(form);busy=true;profileMessage='';form.querySelector('button').disabled=true;try{if(kind==='register')await registerProfile(values);if(kind==='login')await loginProfile(values);if(kind==='import')await importProfile(form,values);}catch(err){profileMessage=err.message||'Operazione non riuscita. Riprova.';}finally{busy=false;render();}});
document.addEventListener('visibilitychange',tickClock);
persistVault();render();
</script>
</body></html>
